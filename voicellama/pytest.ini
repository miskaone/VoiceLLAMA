[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    unit: marks tests as unit tests
    benchmark: marks tests as performance benchmarks (run with 'pytest --benchmark-only')
    kokoro: marks tests that require real Kokoro pipeline (skip if not available)

